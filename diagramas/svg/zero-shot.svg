<text x="30.0" y="151.0" class="d-t" text-anchor="start" style="font-size:11px">a centered satellite photo of highway.</text>
<text x="170.0" y="180.0" class="d-t" text-anchor="middle" style="font-size:12px">… (10 frases)</text>
