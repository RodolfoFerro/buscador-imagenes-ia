<text x="800.0" y="282.0" class="d-h" text-anchor="middle" style="font-size:13px">Predicción: la frase</text>
<text x="800.0" y="300.0" class="d-acc-t" text-anchor="middle" style="font-size:13px">más similar → Bosque</text>
