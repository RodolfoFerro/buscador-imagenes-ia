<svg viewBox="0 0 960 275" width="960" height="275" role="img" xmlns="http://www.w3.org/2000/svg"><title>Similitud coseno: vectores con ángulo pequeño tienen similitud cercana a 1, perpendiculares 0 y opuestos −1</title>
<style>
text { font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; }
.d-t { fill: #6A6A70; font-size: 13px; }
.d-h { fill: #101012; font-size: 14px; font-weight: 600; }
.d-faint { fill: #6A6A70; opacity: 0.8; font-size: 12px; }
.d-acc-t { fill: #2a78d6; font-weight: 600; }
.d-o-t { fill: #eb6834; font-weight: 600; }
.d-on-acc { fill: #FFFFFF; font-weight: 600; }
.d-box { fill: #E7E7EA; stroke: #D9D9DC; }
.d-panel { fill: #FFFFFF; stroke: #D9D9DC; }
.d-frame { fill: none; stroke: #D9D9DC; }
.d-enc { fill: rgba(42, 120, 214, 0.14); stroke: #2a78d6; stroke-width: 1.5; }
.d-frozen { fill: #E7E7EA; stroke: #A6A6AC; stroke-width: 1.5; stroke-dasharray: 6 4; }
.d-mute { fill: #A6A6AC; opacity: 0.55; }
.d-chan-r { fill: rgba(220, 40, 40, 0.55); }
.d-chan-g { fill: rgba(30, 170, 60, 0.55); }
.d-chan-b { fill: rgba(40, 80, 220, 0.55); }
.d-line { stroke: #A6A6AC; stroke-width: 1.5; fill: none; }
.d-thick { stroke-width: 2.5; }
.d-dash { stroke-dasharray: 5 4; }
.d-grid { stroke: rgba(255, 255, 255, 0.75); stroke-width: 1; }
.d-edge { stroke: #A6A6AC; stroke-width: 1; opacity: 0.8; }
.d-acc-line { stroke: #2a78d6; stroke-width: 1.8; fill: none; }
.d-o-line { stroke: #eb6834; stroke-width: 1.8; fill: none; }
.d-head { fill: #A6A6AC; }
.d-acc { fill: #2a78d6; }
.d-o { fill: #eb6834; }
.d-g { fill: #1baf7a; }
.d-ring { stroke: #FFFFFF; stroke-width: 2; }
.d-pt { fill: #2a78d6; fill-opacity: 0.55; }
.d-dot, .d-ink-dot { fill: #101012; }
.d-halo { fill: rgba(42, 120, 214, 0.14); stroke: #2a78d6; stroke-dasharray: 5 4; }
.d-query { fill: #FFFFFF; stroke: #101012; stroke-width: 3; }
</style>
<defs>
<marker id="similitud-coseno-f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-head"/></marker>
<marker id="similitud-coseno-fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-acc"/></marker>
<marker id="similitud-coseno-fo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-o"/></marker>
</defs>
<rect width="960" height="275" fill="#FFFFFF"/>
<line x1="90.0" y1="170.0" x2="207.5" y2="127.2" class="d-acc-line d-thick" marker-end="url(#similitud-coseno-fa)"/>
<line x1="90.0" y1="170.0" x2="170.3" y2="74.2" class="d-o-line d-thick" marker-end="url(#similitud-coseno-fo)"/>
<path d="M125.7,157.0 A38,38 0 0 0 114.4,140.9" class="d-line"/>
<text x="134.2" y="144.0" class="d-h" text-anchor="middle" style="font-size:13px">θ</text>
<circle cx="90" cy="170" r="3" class="d-dot"/>
<text x="160.0" y="215.0" class="d-t" text-anchor="middle" style="font-size:13px">θ pequeño</text>
<text x="160.0" y="237.0" class="d-h" text-anchor="middle" style="font-size:15px">sim ≈ 0.9</text>
<text x="160.0" y="257.0" class="d-t" text-anchor="middle" style="font-size:13px">parecidos</text>
<line x1="410.0" y1="170.0" x2="535.0" y2="170.0" class="d-acc-line d-thick" marker-end="url(#similitud-coseno-fa)"/>
<line x1="410.0" y1="170.0" x2="410.0" y2="45.0" class="d-o-line d-thick" marker-end="url(#similitud-coseno-fo)"/>
<path d="M448.0,170.0 A38,38 0 0 0 410.0,132.0" class="d-line"/>
<text x="448.2" y="136.8" class="d-h" text-anchor="middle" style="font-size:13px">θ</text>
<circle cx="410" cy="170" r="3" class="d-dot"/>
<text x="480.0" y="215.0" class="d-t" text-anchor="middle" style="font-size:13px">θ = 90°</text>
<text x="480.0" y="237.0" class="d-h" text-anchor="middle" style="font-size:15px">sim = 0</text>
<text x="480.0" y="257.0" class="d-t" text-anchor="middle" style="font-size:13px">sin relación</text>
<line x1="800.0" y1="170.0" x2="925.0" y2="170.0" class="d-acc-line d-thick" marker-end="url(#similitud-coseno-fa)"/>
<line x1="800.0" y1="170.0" x2="675.0" y2="170.0" class="d-o-line d-thick" marker-end="url(#similitud-coseno-fo)"/>
<path d="M838.0,170.0 A38,38 0 0 0 762.0,170.0" class="d-line"/>
<text x="800.0" y="121.0" class="d-h" text-anchor="middle" style="font-size:13px">θ</text>
<circle cx="800" cy="170" r="3" class="d-dot"/>
<text x="800.0" y="215.0" class="d-t" text-anchor="middle" style="font-size:13px">θ = 180°</text>
<text x="800.0" y="237.0" class="d-h" text-anchor="middle" style="font-size:15px">sim = −1</text>
<text x="800.0" y="257.0" class="d-t" text-anchor="middle" style="font-size:13px">opuestos</text>
</svg>
