<svg viewBox="0 0 960 285" width="960" height="285" role="img" xmlns="http://www.w3.org/2000/svg"><title>Una imagen de 64 × 64 × 3 pasa por el codificador de CLIP y se convierte en un vector de 512 números</title>
<style>
text { font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; }
.d-t { fill: #6A6A70; font-size: 13px; }
.d-h { fill: #101012; font-size: 14px; font-weight: 600; }
.d-faint { fill: #6A6A70; opacity: 0.8; font-size: 12px; }
.d-acc-t { fill: #2a78d6; font-weight: 600; }
.d-o-t { fill: #eb6834; font-weight: 600; }
.d-on-acc { fill: #FFFFFF; font-weight: 600; }
.d-box { fill: #E7E7EA; stroke: #D9D9DC; }
.d-panel { fill: #FFFFFF; stroke: #D9D9DC; }
.d-frame { fill: none; stroke: #D9D9DC; }
.d-enc { fill: rgba(42, 120, 214, 0.14); stroke: #2a78d6; stroke-width: 1.5; }
.d-frozen { fill: #E7E7EA; stroke: #A6A6AC; stroke-width: 1.5; stroke-dasharray: 6 4; }
.d-mute { fill: #A6A6AC; opacity: 0.55; }
.d-chan-r { fill: rgba(220, 40, 40, 0.55); }
.d-chan-g { fill: rgba(30, 170, 60, 0.55); }
.d-chan-b { fill: rgba(40, 80, 220, 0.55); }
.d-line { stroke: #A6A6AC; stroke-width: 1.5; fill: none; }
.d-thick { stroke-width: 2.5; }
.d-dash { stroke-dasharray: 5 4; }
.d-grid { stroke: rgba(255, 255, 255, 0.75); stroke-width: 1; }
.d-edge { stroke: #A6A6AC; stroke-width: 1; opacity: 0.8; }
.d-acc-line { stroke: #2a78d6; stroke-width: 1.8; fill: none; }
.d-o-line { stroke: #eb6834; stroke-width: 1.8; fill: none; }
.d-head { fill: #A6A6AC; }
.d-acc { fill: #2a78d6; }
.d-o { fill: #eb6834; }
.d-g { fill: #1baf7a; }
.d-ring { stroke: #FFFFFF; stroke-width: 2; }
.d-pt { fill: #2a78d6; fill-opacity: 0.55; }
.d-dot, .d-ink-dot { fill: #101012; }
.d-halo { fill: rgba(42, 120, 214, 0.14); stroke: #2a78d6; stroke-dasharray: 5 4; }
.d-query { fill: #FFFFFF; stroke: #101012; stroke-width: 3; }
</style>
<defs>
<marker id="imagen-a-vector-f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-head"/></marker>
<marker id="imagen-a-vector-fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-acc"/></marker>
<marker id="imagen-a-vector-fo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-o"/></marker>
</defs>
<rect width="960" height="285" fill="#FFFFFF"/>
<rect x="76.0" y="34.0" width="150.0" height="150.0" rx="3" class="d-chan-b"/>
<rect x="63.0" y="47.0" width="150.0" height="150.0" rx="3" class="d-chan-g"/>
<rect x="50.0" y="60.0" width="150.0" height="150.0" rx="3" class="d-chan-r"/>
<image href="data:image/jpeg;base64," x="50.0" y="60.0" width="150.0" height="150.0" preserveAspectRatio="none"/><rect x="50.0" y="60.0" width="150.0" height="150.0" rx="2" class="d-frame"/>
<text x="138.0" y="240.0" class="d-h" text-anchor="middle">Imagen: 64 × 64 × 3</text>
<text x="138.0" y="260.0" class="d-t" text-anchor="middle">12,288 números (pixeles)</text>
<line x1="250.0" y1="135.0" x2="318.0" y2="135.0" class="d-line" marker-end="url(#imagen-a-vector-f)"/>
<polygon points="330,55 500,95 500,175 330,215" class="d-enc"/>
<text x="412.0" y="130.0" class="d-h" text-anchor="middle" style="font-size:16px">CLIP</text>
<text x="412.0" y="150.0" class="d-t" text-anchor="middle" style="font-size:12px">codificador</text>
<text x="412.0" y="165.0" class="d-t" text-anchor="middle" style="font-size:12px">de imágenes</text>
<line x1="512.0" y1="135.0" x2="580.0" y2="135.0" class="d-line" marker-end="url(#imagen-a-vector-f)"/>
<rect x="595.0" y="120.0" width="18.0" height="30.0" rx="2" class="d-acc" fill-opacity="0.22"/>
<rect x="616.0" y="120.0" width="18.0" height="30.0" rx="2" class="d-acc" fill-opacity="0.35"/>
<rect x="637.0" y="120.0" width="18.0" height="30.0" rx="2" class="d-acc" fill-opacity="0.83"/>
<rect x="658.0" y="120.0" width="18.0" height="30.0" rx="2" class="d-acc" fill-opacity="0.64"/>
<rect x="679.0" y="120.0" width="18.0" height="30.0" rx="2" class="d-acc" fill-opacity="0.23"/>
<rect x="700.0" y="120.0" width="18.0" height="30.0" rx="2" class="d-acc" fill-opacity="0.52"/>
<rect x="721.0" y="120.0" width="18.0" height="30.0" rx="2" class="d-acc" fill-opacity="0.56"/>
<rect x="742.0" y="120.0" width="18.0" height="30.0" rx="2" class="d-acc" fill-opacity="0.29"/>
<rect x="763.0" y="120.0" width="18.0" height="30.0" rx="2" class="d-acc" fill-opacity="0.77"/>
<rect x="784.0" y="120.0" width="18.0" height="30.0" rx="2" class="d-acc" fill-opacity="0.25"/>
<rect x="805.0" y="120.0" width="18.0" height="30.0" rx="2" class="d-acc" fill-opacity="0.48"/>
<rect x="826.0" y="120.0" width="18.0" height="30.0" rx="2" class="d-acc" fill-opacity="0.59"/>
<text x="857.0" y="140.0" class="d-t" text-anchor="middle" style="font-size:16px">…</text>
<rect x="873.0" y="120.0" width="18.0" height="30.0" rx="2" class="d-acc" fill-opacity="0.43"/>
<rect x="894.0" y="120.0" width="18.0" height="30.0" rx="2" class="d-acc" fill-opacity="0.99"/>
<text x="760.0" y="100.0" class="d-h" text-anchor="middle">Embedding</text>
<text x="760.0" y="182.0" class="d-t" text-anchor="middle" style="font-size:12px">[0.009, −0.000, 0.024, −0.033, …]</text>
<text x="760.0" y="240.0" class="d-h" text-anchor="middle">512 números que resumen</text>
<text x="760.0" y="260.0" class="d-t" text-anchor="middle">el contenido de la imagen</text>
</svg>
